<!DOCTYPE html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#F5F1E8" />
    <meta name="description" content="AI physiotherapy practice for patients" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="PhysioAI" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <title>%WEB_TITLE%</title>
    <style id="expo-reset">
      html,
      body {
        width: 100%;
        min-height: 100%;
        margin: 0;
        padding: 0;
        background: #f5f1e8;
      }
      body {
        overflow-x: hidden;
        overscroll-behavior-y: none;
      }
      #root {
        display: flex;
        width: 100%;
        min-height: 100vh;
        min-height: 100dvh;
        flex: 1;
      }
      @media (min-width: 640px) {
        #root {
          max-width: 560px;
          margin: 0 auto;
          box-shadow: 0 0 42px rgba(18, 36, 30, 0.08);
        }
      }
      input,
      button {
        font: inherit;
      }
    </style>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run PhysioAI.</noscript>
    <div id="root"></div>
  </body>
</html>
